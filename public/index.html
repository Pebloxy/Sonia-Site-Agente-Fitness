<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonia – Assistente Virtual da Academia</title>
<style>
  :root { --bg:#0b1626; --panel:#13243d; --panel2:#0f1d33; --me:#2f6fed; --sonia:#1d3555; --text:#eef3fb; --muted:#9fb0c8; --accent:#4fd1c5; --line:#26405f; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { height: 100%; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); }
  .layout { height:100vh; display:grid; grid-template-columns: minmax(300px, 42%) 1fr; }
  /* ----- lado da Sonia ----- */
  .stage { position:relative; background: radial-gradient(120% 90% at 50% 25%, #1f4a7a 0%, #12294a 45%, #0b1626 100%); overflow:hidden; display:flex; flex-direction:column; }
  .stage header { padding:16px 20px; display:flex; align-items:center; gap:12px; z-index:2; }
  .stage .logo { width:40px; height:40px; border-radius:50%; background:var(--accent); color:#0b1626; display:grid; place-items:center; font-weight:bold; font-size:18px; }
  .stage h1 { font-size:18px; margin:0; letter-spacing:.3px; }
  .stage small { color:var(--muted); display:block; }
  #avatar { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; }
  #avatar:active { cursor:grabbing; }
  #avatar-loading, #avatar-fallback { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); text-align:center; padding:24px; }
  #avatar-fallback .big { width:120px; height:120px; border-radius:50%; background:var(--accent); color:#0b1626; display:grid; place-items:center; font-size:56px; font-weight:bold; margin:0 auto 12px; }
  .status { position:absolute; left:0; right:0; bottom:14px; text-align:center; font-size:13px; color:var(--muted); z-index:2; }
  .status b { color:var(--accent); }
  .tools { position:absolute; right:14px; top:14px; z-index:3; display:flex; gap:8px; }
  .tools button { background:rgba(15,29,51,.75); color:var(--text); border:1px solid var(--line); border-radius:18px; padding:7px 12px; font-size:13px; cursor:pointer; }
  .tools button[aria-pressed="false"] { opacity:.6; }
  /* ----- chat ----- */
  .chat-col { display:flex; flex-direction:column; background:var(--panel); min-width:0; height:100vh; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:16px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .sonia { align-self:flex-start; background:var(--sonia); border-bottom-left-radius:4px; }
  .typing { color:var(--muted); font-style:italic; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 20px 10px; }
  .chips button { background:transparent; color:var(--accent); border:1px solid var(--accent); border-radius:16px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .chips button:hover { background:rgba(79,209,197,.12); }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel2); }
  input { flex:1; padding:12px 14px; border-radius:22px; border:1px solid #2c4a70; background:#0b1626; color:var(--text); font-size:16px; min-width:0; }
  form button { padding:0 22px; border:0; border-radius:22px; background:var(--accent); color:#0b1626; font-weight:bold; font-size:15px; cursor:pointer; }
  form button:disabled { opacity:.5; cursor:default; }
  .note { text-align:center; color:var(--muted); font-size:12px; padding:0 12px 10px; background:var(--panel2); }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 38vh 1fr; }
    .chat-col { height:auto; min-height:0; }
  }
</style>
</head>
<body>
<div class="layout">
  <section class="stage" aria-label="Sonia">
    <header>
      <div class="logo">S</div>
      <div><h1>Sonia</h1><small>Assistente virtual da academia</small></div>
    </header>
    <canvas id="avatar" aria-label="Sonia em 3D. Arraste para girar, clique duas vezes para mudar o zoom."></canvas>
    <div id="avatar-loading">Carregando a Sonia…</div>
    <div id="avatar-fallback" hidden><div><div class="big">S</div>Não consegui mostrar o avatar 3D neste navegador, mas a Sonia continua disponível no chat.</div></div>
    <div class="tools">
      <button id="btn-voice" type="button" aria-pressed="true" title="Ligar ou desligar a voz da Sonia">🔊 Voz</button>
      <button id="btn-zoom" type="button" title="Mudar o enquadramento">🔍 Zoom</button>
    </div>
    <div class="status" id="status">Arraste para girar · clique duas vezes para mudar o zoom</div>
  </section>

  <section class="chat-col">
    <div id="chat" aria-live="polite"></div>
    <div class="chips" id="chips">
      <button type="button">Qual é a minha rotina de hoje?</button>
      <button type="button">Quero agendar uma aula</button>
      <button type="button">Como faço o agachamento?</button>
      <button type="button">Quais modalidades vocês têm?</button>
    </div>
    <form id="form">
      <input id="text" autocomplete="off" placeholder="Digite sua mensagem..." maxlength="1000" aria-label="Mensagem">
      <button id="btn" type="submit">Enviar</button>
    </form>
    <div class="note">A Sonia é uma inteligência artificial e suas respostas podem conter imprecisões.</div>
  </section>
</div>

<script src="avatar.js"></script>
<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('text');
  const btn = document.getElementById('btn');
  const statusEl = document.getElementById('status');
  const messages = []; // { role: 'user' | 'sonia', text }

  // ---------- voz da Sonia (síntese de voz do navegador) ----------
  let voiceOn = true, ptVoice = null;
  const synth = window.speechSynthesis;
  function pickVoice() {
    if (!synth) return;
    const vs = synth.getVoices();
    ptVoice = vs.find((v) => /pt[-_]BR/i.test(v.lang) && /female|feminina|maria|francisca|luciana|google/i.test(v.name))
           || vs.find((v) => /pt[-_]BR/i.test(v.lang)) || vs.find((v) => /^pt/i.test(v.lang)) || null;
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
  function speakingState(on) {
    if (window.sonia) window.sonia.setSpeaking(on);
    statusEl.innerHTML = on ? '<b>Sonia está falando…</b>' : 'Arraste para girar · clique duas vezes para mudar o zoom';
  }
  function speak(text) {
    if (!synth || !voiceOn) return;
    synth.cancel();
    const clean = text.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').replace(/[*_#`]/g, '').trim();
    if (!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'pt-BR'; if (ptVoice) u.voice = ptVoice;
    u.rate = 1.05; u.pitch = 1.1;
    u.onstart = () => speakingState(true);
    u.onend = u.onerror = () => speakingState(false);
    synth.speak(u);
  }
  document.getElementById('btn-voice').addEventListener('click', (e) => {
    voiceOn = !voiceOn;
    e.currentTarget.setAttribute('aria-pressed', String(voiceOn));
    if (!voiceOn && synth) { synth.cancel(); speakingState(false); }
  });
  document.getElementById('btn-zoom').addEventListener('click', () => window.sonia && window.sonia.toggleZoom());

  // ---------- chat ----------
  function add(role, text, cls = '') {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'me' : 'sonia') + ' ' + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function send(text) {
    document.getElementById('chips').style.display = 'none';
    if (synth) { synth.cancel(); speakingState(false); }
    messages.push({ role: 'user', text });
    add('user', text);
    btn.disabled = true;
    const typing = add('sonia', 'Sonia está digitando...', 'typing');
    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages }),
      });
      const data = await r.json();
      typing.remove();
      const reply = data.reply || 'Ops, não consegui responder agora.';
      messages.push({ role: 'sonia', text: reply });
      add('sonia', reply);
      speak(reply);
    } catch (e) {
      typing.remove();
      add('sonia', 'Ops, perdi a conexão. Tenta de novo!');
    }
    btn.disabled = false;
    input.focus();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || btn.disabled) return;
    input.value = '';
    send(text);
  });
  document.querySelectorAll('#chips button').forEach((b) => b.addEventListener('click', () => send(b.textContent)));

  add('sonia', 'Oi! Eu sou a Sonia, sua assistente aqui da academia 💪 Posso tirar dúvidas de treino, mostrar horários e te ajudar a agendar. Bora começar?');
</script>
</body>
</html>
